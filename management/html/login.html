<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">

    <title>Fluxum - Painel de gerenciamento</title>

    <link rel="stylesheet" href="../css/all.css">
    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/login.js" defer></script>
</head>

<body class="paginaLogin">
    <main>
        <header>
            <p class="subtitulo">FLUXUM - PÁGINA DE LOGIN</p>

            <h1>Sistema de Gerenciamento</h1>

            <span>
                Bem-vindo(a) ao sistema de Gerenciamento da Fluxum.
                Faça seu login para continuar com acesso ao sistema.
                <br><br>
                Não sabe seu acesso? Acesse seu email e veja na
                caixa de mensagem o seu acesso.
            </span>
        </header>

        <form id="formLogin">
            <label for="usuario">Usuário</label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                maxlength="100"
                autocomplete="username"
                required
                autofocus
            >

            <label for="senha">Senha</label>

            <input type="password" id="senha" placeholder="Digite sua senha">
            <button type="button" id="btnMostrar">Mostrar senha</button>


            <div class="acoes">
                <button id="entrar" type="submit">
                    Entrar
                </button>
            </div>

            <p id="mensagemLogin" role="status" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
