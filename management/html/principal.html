<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Tela principal</title>
    <link rel="stylesheet" href="../css/principal.css">
    <link rel="stylesheet" href="../css/all.css">
    <script src="../js/principal.js" defer></script>
</head>
<body>
    <main>
        <header>
            <p class="subtitulo">ELECTRON + MYSQL</p>
            <h1>Sistema acadêmico</h1>
            <p>Selecione um cadastro para começar.</p>
        </header>

        <nav class="gradeMenu" aria-label="Cadastros">
            <button type="button" data-cadastro="alunos" autofocus>Cadastro de alunos</button>
            <button type="button" data-cadastro="cursos">Cadastro de cursos</button>
            <button type="button" data-cadastro="matriculas">Cadastro de matrículas</button>
        </nav>

        <button type="button" id="sair" class="secundario">Sair</button>
    </main>
</body>
</html>
